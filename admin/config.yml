backend:
  name: github
  repo: aloksooryavanshii/aloksooryavanshiiportfolio
  branch: main
  base_url: https://aloksooryavanshiiportfolio.vercel.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "settings"
    label: "⚙️ Site Settings"
    files:

      - name: "hero"
        label: "🏠 Hero Section"
        file: "_data/hero.json"
        format: json
        fields:
          - { label: "Your Name", name: "name", widget: "string" }
          - { label: "Status Tag", name: "tag", widget: "string" }
          - { label: "Bio", name: "bio", widget: "text" }
          - label: "Roles (cycling text)"
            name: "roles"
            widget: "list"
            field: { label: "Role", name: "role", widget: "string" }
          - { label: "NPTEL Certifications Count", name: "stat_nptel", widget: "number" }
          - { label: "Expected Graduation Year", name: "stat_year", widget: "number" }
          - { label: "Projects Built Count", name: "stat_projects", widget: "number" }

      - name: "about"
        label: "👤 About Section"
        file: "_data/about.json"
        format: json
        fields:
          - { label: "Profile Photo", name: "photo", widget: "image" }
          - { label: "Paragraph 1", name: "para1", widget: "text" }
          - { label: "Paragraph 2", name: "para2", widget: "text" }

  - name: "projects"
    label: "🚀 Projects"
    folder: "_data/projects"
    create: true
    slug: "{{slug}}"
    format: json
    extension: json
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Tech Tags"
        name: "tags"
        widget: "list"
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "GitHub Link", name: "github", widget: "string", required: false }
      - { label: "Live Demo Link", name: "demo", widget: "string", required: false }
      - { label: "Featured Project?", name: "featured", widget: "boolean", default: false }

  - name: "certifications"
    label: "🏆 Certifications"
    folder: "_data/certifications"
    create: true
    slug: "{{slug}}"
    format: json
    extension: json
    fields:
      - { label: "Certification Name", name: "title", widget: "string" }
      - { label: "Issued By", name: "issuer", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Certificate Link", name: "link", widget: "string", required: false }

  - name: "writing"
    label: "✍️ Writing / Articles"
    folder: "_data/writing"
    create: true
    slug: "{{slug}}"
    format: json
    extension: json
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Platform", name: "platform", widget: "string" }
      - { label: "Short Description", name: "description", widget: "text" }
      - { label: "Article Link", name: "link", widget: "string" }
      - { label: "Date Published", name: "date", widget: "datetime" }