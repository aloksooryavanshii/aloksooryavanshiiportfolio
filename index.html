<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | Alok Kumar Portfolio</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* ── Google Fonts ── */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap');

    /* ── Override Netlify CMS root styles ── */
    #nc-root {
      font-family: 'DM Sans', system-ui, sans-serif !important;
    }

    /* ── Sidebar ── */
    [class*="SidebarContainer"],
    [class*="sidebar"] {
      background: #111009 !important;
      border-right: 1px solid #2a2520 !important;
    }

    /* Sidebar header / brand */
    [class*="sidebar"] h1,
    [class*="sidebar"] [class*="brand"] {
      font-family: 'Playfair Display', Georgia, serif !important;
      color: #e07b24 !important;
      font-size: 1.4rem !important;
      letter-spacing: 0.04em !important;
    }

    /* Sidebar nav links */
    [class*="sidebar"] a,
    [class*="sidebar"] button,
    [class*="Nav"] a {
      color: #a09d96 !important;
      font-size: 0.9rem !important;
      font-weight: 500 !important;
      border-radius: 8px !important;
      transition: all 0.2s !important;
    }

    [class*="sidebar"] a:hover,
    [class*="Nav"] a:hover {
      color: #e07b24 !important;
      background: rgba(224, 123, 36, 0.08) !important;
    }

    /* Active nav item */
    [class*="sidebar"] a[class*="active"],
    [class*="Nav"] a[class*="active"] {
      color: #e07b24 !important;
      background: rgba(224, 123, 36, 0.12) !important;
      border-left: 3px solid #e07b24 !important;
    }

    /* ── Main content area ── */
    [class*="App"],
    [class*="MainContainer"],
    [class*="Page"] {
      background: #1a1814 !important;
    }

    /* ── Collection list cards ── */
    [class*="CardGrid"] > div,
    [class*="EntryCard"],
    [class*="card"] {
      background: #1f1d18 !important;
      border: 1px solid #2a2520 !important;
      border-radius: 14px !important;
      transition: all 0.25s !important;
      overflow: hidden !important;
    }

    [class*="EntryCard"]:hover,
    [class*="card"]:hover {
      border-color: #e07b24 !important;
      transform: translateY(-3px) !important;
      box-shadow: 0 8px 24px rgba(224,123,36,0.12) !important;
    }

    /* Card titles */
    [class*="EntryCard"] h2,
    [class*="EntryCard"] [class*="title"],
    [class*="card"] h2 {
      color: #f0ede6 !important;
      font-family: 'Playfair Display', Georgia, serif !important;
      font-size: 1.1rem !important;
    }

    /* ── Top toolbar ── */
    [class*="Toolbar"],
    [class*="AppHeader"],
    [class*="top-bar"] {
      background: #111009 !important;
      border-bottom: 1px solid #2a2520 !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3) !important;
    }

    /* ── Buttons ── */
    button[class*="primary"],
    [class*="Button"][class*="primary"],
    button[class*="Publish"],
    [class*="publish"] button {
      background: linear-gradient(135deg, #e07b24, #c8640a) !important;
      color: #fff !important;
      border: none !important;
      border-radius: 8px !important;
      font-family: 'DM Sans', sans-serif !important;
      font-weight: 600 !important;
      padding: 10px 22px !important;
      box-shadow: 0 4px 14px rgba(224,123,36,0.3) !important;
      transition: all 0.2s !important;
    }

    button[class*="primary"]:hover,
    [class*="Button"][class*="primary"]:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 6px 20px rgba(224,123,36,0.4) !important;
    }

    /* New entry buttons (dark outlined) */
    button[class*="new"],
    [class*="NewButton"],
    [class*="Button"]:not([class*="primary"]) {
      background: transparent !important;
      border: 1px solid #2a2520 !important;
      color: #a09d96 !important;
      border-radius: 8px !important;
    }

    /* ── Form fields ── */
    input[type="text"],
    input[type="email"],
    input[type="number"],
    textarea,
    select,
    [class*="TextInput"],
    [class*="NumberInput"],
    [class*="Select"] {
      background: #111009 !important;
      border: 1px solid #2a2520 !important;
      border-radius: 8px !important;
      color: #f0ede6 !important;
      font-family: 'DM Sans', sans-serif !important;
      padding: 10px 14px !important;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #e07b24 !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(224,123,36,0.15) !important;
    }

    /* ── Labels ── */
    label,
    [class*="FieldLabel"],
    [class*="label"] {
      color: #a09d96 !important;
      font-size: 0.78rem !important;
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.08em !important;
      font-family: 'DM Sans', sans-serif !important;
    }

    /* ── Page headings ── */
    [class*="CollectionHeader"] h1,
    [class*="PageTitle"],
    h1[class*="heading"] {
      font-family: 'Playfair Display', Georgia, serif !important;
      color: #f0ede6 !important;
      font-size: 1.8rem !important;
    }

    /* ── Empty state ── */
    [class*="Empty"],
    [class*="empty"] {
      color: #6b6760 !important;
    }

    /* ── Breadcrumb ── */
    [class*="Breadcrumb"],
    [class*="breadcrumb"] {
      color: #6b6760 !important;
      font-size: 0.85rem !important;
    }

    [class*="Breadcrumb"] span[class*="active"],
    [class*="breadcrumb"] span:last-child {
      color: #e07b24 !important;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111009; }
    ::-webkit-scrollbar-thumb { background: #2a2520; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #e07b24; }

    /* ── Status badge (Published/Draft) ── */
    [class*="Published"],
    [class*="status"][class*="published"] {
      background: rgba(34,197,94,0.15) !important;
      color: #22c55e !important;
      border-radius: 100px !important;
      padding: 3px 10px !important;
      font-size: 0.75rem !important;
      font-weight: 600 !important;
    }

    /* ── Toggle / switch ── */
    [class*="Toggle"] [class*="checked"],
    input[type="checkbox"]:checked {
      background: #e07b24 !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
</body>
</html>
